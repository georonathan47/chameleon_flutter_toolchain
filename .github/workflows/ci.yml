name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    name: Analyze + test packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test

      - name: chameleon_cli — pub get, analyze, test
        working-directory: cli/chameleon_cli
        run: |
          dart pub get
          dart analyze
          dart test -j 1

      # Not part of the melos/pub workspace: custom_lint's cli_util
      # constraint (^0.4.2) conflicts with melos's own (>=0.5.0 <0.7.0),
      # so this package resolves and runs standalone.
      - name: chameleon_lints — pub get, analyze, test
        working-directory: packages/chameleon_lints
        run: |
          dart pub get
          dart analyze
          dart test

  e2e:
    name: Generate-and-verify matrix
    needs: packages
    # The biometrics and with-permissions variants run a real `pod
    # install`, which needs CocoaPods — only macOS agents have it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: dart pub global activate mason_cli
      - run: dart pub global activate very_good_cli

      - run: bash e2e/run_matrix.sh
