name: chameleon_core
description: Vendor-agnostic Flutter infrastructure — errors, networking, logging, feature flags, and DI — for the Chameleon toolchain.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  bloc: ^9.2.1
  chopper: ^8.7.0
  connectivity_plus: ^7.3.0
  device_info_plus: ^12.1.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  injectable: ^2.7.1
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  injectable_generator: ^2.7.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0
