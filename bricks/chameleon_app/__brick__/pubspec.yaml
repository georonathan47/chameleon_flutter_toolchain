name: {{project_name.snakeCase()}}
description: {{description}}
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  chameleon_ui:
    git:
      url: https://github.com/georonathan47/chameleon_flutter_toolchain
      path: packages/chameleon_ui
      ref: {{chameleon_ui_ref}}
  chameleon_core:
    git:
      url: https://github.com/georonathan47/chameleon_flutter_toolchain
      path: packages/chameleon_core
      ref: {{chameleon_core_ref}}

  # Unconditional regardless of state_management: chameleon_core's own
  # ConnectivityBloc is a real Bloc (chameleon_core depends on
  # flutter_bloc itself), and `chameleon feature` always generates
  # Bloc-shaped feature code either way — see that generator's own note.
  # provider/flutter_riverpod below are additive, layered on top when
  # chosen, not replacements.
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  {{#is_bloc}}
  hydrated_bloc: ^11.0.0
  {{/is_bloc}}
  {{#is_provider}}
  provider: ^6.1.5+1
  {{/is_provider}}
  {{#is_riverpod}}
  flutter_riverpod: ^3.4.3
  {{/is_riverpod}}
  equatable: ^2.1.0
  fpdart: ^1.2.0
  chopper: ^8.7.0
  get_it: ^9.2.1
  injectable: ^2.7.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  envied: ^1.3.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.0
  {{#use_biometrics}}
  local_auth: ^3.0.2
  {{/use_biometrics}}
  {{#has_permissions}}
  permission_handler: ^12.0.3
  {{/has_permissions}}
  {{#use_home_widget}}
  home_widget: ^0.10.0
  {{/use_home_widget}}
  {{#use_push_notifications}}
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  {{/use_push_notifications}}
  {{#use_go_router}}
  go_router: ^17.3.0
  {{/use_go_router}}
  {{^use_go_router}}
  auto_route: ^11.0.0
  {{/use_go_router}}

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0
  build_runner: ^2.4.15
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  chopper_generator: ^8.7.0
  envied_generator: ^1.3.1
  {{^use_go_router}}
  auto_route_generator: ^10.4.0
  {{/use_go_router}}
  mocktail: ^1.0.5
  # For building real chopper Response fixtures in datasource tests
  # (chameleon_core's own auth_interceptor_test.dart does the same).
  http: ^1.6.0
  # Unconditional for the same reason flutter_bloc is above.
  bloc_test: ^10.0.0
  custom_lint: ^0.8.0
  chameleon_lints:
    git:
      url: https://github.com/georonathan47/chameleon_flutter_toolchain
      path: packages/chameleon_lints
      ref: {{chameleon_lints_ref}}

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/videos/
