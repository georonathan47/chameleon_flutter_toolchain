include: package:very_good_analysis/analysis_options.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    # bootstrap.dart's Bloc.observer wiring imports flutter_bloc directly,
    # deliberately, regardless of state_management: it observes
    # chameleon_core's own ConnectivityBloc, which is Bloc-based
    # unconditionally, not something this app's own choice governs —
    # flutter_bloc is only a direct pubspec.yaml dependency when
    # state_management is bloc (see that file's own comment), so this
    # otherwise-legitimate diagnostic always fires there for provider/
    # riverpod choices. A per-line `// ignore:` comment isn't enough:
    # `dart fix --apply` (unconditional in `chameleon create`'s own
    # pipeline) doesn't respect it and silently adds flutter_bloc back to
    # pubspec.yaml as a direct dependency anyway — confirmed by actually
    # running it. Disabling the diagnostic itself, not just its report,
    # is the only thing that stops dart fix from "fixing" it too.
    depend_on_referenced_packages: ignore
  exclude:
    - "build/**"
    # The whole directory, not just gen/**: lib/l10n/l10n.dart itself is
    # very_good_cli's own generated file too (not brick-templated, so this
    # toolchain can't patch its content the way it can a __brick__
    # template) — found for real when chameleon_lints-v0.2.0's
    # chameleon_prefer_dot_shorthands rule flagged it, which nothing could
    # ever fix, permanently failing `chameleon create`'s own --verify step
    # for every generated app.
    - "lib/l10n/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.chopper.dart"
    - "**/*.config.dart"

linter:
  rules:
    directives_ordering: false
    use_build_context_synchronously: false
    always_use_package_imports: false
    prefer_relative_imports: true
    public_member_api_docs: false
    # The brick's `permissions`/`use_*` variables interleave conditional
    # blocks through pubspec.yaml, so a strict alphabetical order would
    # fight the mustache conditionals rather than help readability.
    sort_pub_dependencies: false
    # very_good_analysis's TODO format check rejects `TODO(chameleon):` — kept
    # as-is since it's this template's own established convention (see
    # tasks/lessons.md) and tool/checks.sh already greps for it directly.
    flutter_style_todos: false
    # chameleon_feature generates one-method repository/datasource interfaces
    # by clean-architecture convention (a single swappable dependency, like
    # a strategy interface) — same reasoning chameleon_core disables this for
    # SessionCache/ChameleonCrashReporter.
    one_member_abstracts: false

formatter:
  trailing_commas: preserve
