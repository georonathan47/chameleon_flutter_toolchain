name: chameleon_app
description: A Chameleon Flutter application — VGV bootstrap, clean architecture, Chameleon design language.
version: 1.0.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  project_name:
    type: string
    description: The project name, in snake_case.
    prompt: Project name?
  org_name:
    type: string
    description: Reverse-domain organization identifier.
    default: com.example
  description:
    type: string
    description: One-line app description.
    default: A Chameleon Flutter application.

  state_management:
    type: enum
    description: >-
      State-management package this app is built around. `bloc` covers
      both Bloc and Cubit (same flutter_bloc package — which specific
      shape a feature uses is a separate, finer-grained choice made later
      via `chameleon bloc --cubit`). `chameleon_core`'s ConnectivityBloc
      and `chameleon_feature`'s generated feature code stay Bloc-based
      unconditionally either way; this choice controls the app's own
      exposed idiom for reaching that state (BlocBuilder vs.
      context.watch vs. ref.watch) and pulls in the matching package.
    values:
      - bloc
      - provider
      - riverpod
    default: bloc

  router:
    type: enum
    description: Router package.
    values:
      - go_router
      - auto_route
    default: go_router
    prompt: Which router?

  use_biometrics:
    type: boolean
    description: >-
      Wire BiometricAuthenticator to local_auth (Face ID/Touch ID/
      fingerprint). Adds local_auth as a dependency and requires manually
      adding NSFaceIDUsageDescription (Info.plist) and the Android
      biometric permission — tool/checks.sh verifies both are present.
    default: false

  permissions:
    type: array
    description: Runtime permissions this app requests.
    values:
      - camera
      - microphone
      - photos
      - location
      - notification
      - contacts
    default: []

  use_home_widget:
    type: boolean
    description: >-
      Wire HomeWidgetUpdater to the home_widget plugin. Adds home_widget as
      a dependency and generates a working Android AppWidgetProvider
      automatically. The iOS Widget Extension target cannot be scripted —
      Apple gives no path for it outside Xcode's own UI — so Swift starter
      source ships under ios/HomeWidgetExtension/ with a README covering
      the manual steps. See docs/architecture.md's "Home screen widgets"
      section.
    default: false

  use_push_notifications:
    type: boolean
    description: >-
      Wire PushNotificationService to firebase_messaging. Adds firebase_core
      and firebase_messaging as dependencies and declares the Android 13+
      POST_NOTIFICATIONS permission automatically. Everything else needs a
      one-time manual step: run `flutterfire configure` (or manually add
      google-services.json/GoogleService-Info.plist) to give the app a real
      Firebase project, and add the Push Notifications + Background Modes
      (remote notifications) capabilities in Xcode — none of that can be
      scripted. See docs/architecture.md's "Push notifications" section.
    default: false

  chameleon_ui_ref:
    type: string
    description: >-
      Pinned git tag of chameleon_ui to depend on, from the toolchain repo
      (https://github.com/georonathan47/chameleon_flutter_toolchain).
      v0.5.0, not v0.1.0: this had gone stale across three prior chameleon_ui
      releases (toast customization, breakpoints, the bottom
      sheet/confirmation dialog/empty state/skeleton components) — none of
      that ever reached a generated app until now. ChameleonTheme.dark
      (this brick's dark-mode wiring) only exists from chameleon_ui-v0.5.0
      on.
    default: chameleon_ui-v0.5.0
  chameleon_core_ref:
    type: string
    description: >-
      Same as chameleon_ui_ref, for chameleon_core. v0.3.0, not v0.2.0:
      PushNotificationService (this brick's use_push_notifications support)
      only exists from chameleon_core-v0.3.0 on.
    default: chameleon_core-v0.3.0
  chameleon_lints_ref:
    type: string
    description: >-
      Same as chameleon_ui_ref, for chameleon_lints. v0.2.0, not v0.1.0:
      also gone stale — the 4 style/architecture guardrail rules added in
      chameleon_lints-v0.2.0 never reached a generated app until now.
    default: chameleon_lints-v0.2.0
