name: chameleon_feature
description: >-
  One clean-architecture feature (data/domain/presentation) for a Chameleon
  app — generated into an existing chameleon_app project, not a standalone
  app.
version: 1.0.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  feature_name:
    type: string
    description: The feature name, in snake_case (e.g. beneficiaries).
    prompt: Feature name?
  project_name:
    type: string
    description: >-
      The target app's own package name (its pubspec.yaml `name:` field) —
      test files import the app's lib code via `package:<project_name>/...`.
      Supplied by the CLI, not prompted for.
    default: ""

  state_management:
    type: enum
    description: >-
      State-management shape for this feature's presentation layer. Same
      three values and bloc-folds-cubit convention as `chameleon create`'s
      own choice (see chameleon_app/brick.yaml) — the CLI defaults this to
      the target app's own choice (read from .chameleon/template.yaml)
      rather than prompting for it every time, but it can be overridden per
      feature for an app that deliberately mixes paradigms.
    values:
      - bloc
      - provider
      - riverpod
    default: bloc
